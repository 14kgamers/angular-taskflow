<div class="container">

  <div class="header">
    <h1>TaskFlow</h1>

    <button>
      + Nova Tarefa
    </button>
  </div>

  <div class="task-grid">

    <div
      class="task-card"
      *ngFor="let task of tasks"
    >

      <div class="status"
           [class.completed]="task.completed">
      </div>

      <h2>{{ task.title }}</h2>

      <p>{{ task.description }}</p>

      <span>
        {{ task.completed ? 'Concluída' : 'Pendente' }}
      </span>

    </div>

  </div>

</div>
